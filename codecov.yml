# Configuration file for codecov reporting code coverage

codecov:
  # Codecov's default branch is master and its settings page won't save, so name it here
  branch: next
  # CI uploads coverage once per test tier (unit, ring-calibration, integration, gui):
  # report only once all four have arrived, so an early upload alone never shows as a
  # coverage drop
  notify:
    after_n_builds: 4

# One coverage comment per PR, posted once all four tiers have uploaded
comment:
  after_n_builds: 4

# files to ignore
ignore:
  - pyrs/_version.py
  - pyrs/icons/icons_*.py

# Fixes report prefix paths from CI dynamic coverage action
# from https://docs.codecov.io/docs/fixing-paths
fixes:
  - "*/pyrs/::/pyrs/"
