[project]
name = "pyrs"
description = "Data reduction and visualization of neutron data measured at the HFIR HB2B instrument"
dynamic = ["version"]
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["neutrons", "python"]
readme = "README.rst"

[project.scripts]
pyrsplot = "scripts.pyrsplot:main"
pyrs-calibration = "pyrs.calibration.peakfit_driver:main"
pyrs-pixel-calibration = "pyrs.calibration.ring_driver:main"
create-mask = "scripts.create_mask:main"

[project.optional-dependencies]
# The ODF step of pyrs.pole_figures (the MTEX tab) needs MTEX for Python (pymtex, PyPI "mtex", GPL-2.0-only).
# PyRS does not distribute it: it is installed separately on the analysis cluster. It is kept out of the
# default, prod, dev and qa environments and of the conda package's run-dependencies. The pixi environment
# "odf" adds it for local runs of the ODF tests.
odf = ["mtex>=1.0,<2"]

####################
### Build config ###
####################

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "pyrs/_version.py"
build-file = "pyrs/_version.py"

[tool.hatch.build]
artifacts = [
  "pyrs/_version.py",
  "pyrs/**/*.yml",
  "pyrs/**/*.yaml",
  "pyrs/**/*.ini",
]

[tool.hatch.build.targets.wheel]
packages = ["pyrs", "scripts"]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.1.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
# Since pixi builds currently require the package version to be set statically in pyproject.toml,
# and we solve that by temporarily changing pyproject.toml during build using the pixi tasks
# sync-version and reset-toml, then we need to ignore uncommitted changes in order for the wheel
# version to be consistent with the package version
dirty = "{version}"
distance-dirty = "{next_version}.dev{distance}"

[tool.versioningit.write]
file = "pyrs/_version.py"

[tool.pixi.workspace]
preview = ["pixi-build"]
channels = [
  "conda-forge",
  # Prefer ORNL-specific Mantid builds first so strict channel priority
  # doesn't exclude needed mantidqt/mantidworkbench candidates.
  "mantid-ornl/label/main",                 # ORNL-specific stable releases
  "mantid-ornl/label/rc",                   # Fallback to RC if stable not available
  "mantid-ornl/label/nightly",              # ORNL-specific nightly builds
  "mantid/label/main",                      # Primary source for stable Mantid releases
  "mantid/label/nightly",                   # Upstream nightly builds
  "neutrons",                               # neutrons_standard (shared Config/Singleton/time utilities)
  "https://prefix.dev/pixi-build-backends",
]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "*"
pip = "*"
# Mantid 7.0 (Python 3.13 only) is released on mantid/label/main; dev takes the 7.0 nightlies.
mantidworkbench = ">=7.0.0,<7.1"
qtpy = "*"
uncertainties = "*"
libarchive = "*"
matplotlib = "*"
numpy = "*"
pandas = "*"
types-six = "*"
nexusformat = ">=1.0.8,<2"
pydantic = ">=2.7.3,<3"
gemmi = ">=0.6,<0.8"             # pyrs.pole_figures: CIF files and structure factors
openpyxl = ">=3.1,<4"            # pyrs.pole_figures: Excel scan table
h5glance = ">=0.9,<0.10"
py-rattler = "==0.24.0"
neutrons_standard = "*"

[tool.pixi.pypi-dependencies]
# PyPI dependencies, including this package to allow local editable installs
pyrs = { path = ".", editable = true }

[tool.pixi.package.host-dependencies]
hatchling = "*"
versioningit = "*"

[tool.pixi.package.run-dependencies]
mantidworkbench = ">=7.0.0, <7.1"
qtpy = "*"
uncertainties = "*"
libarchive = "*"
matplotlib = "*"
numpy = "*"
pandas = "*"
types-six = "*"
nexusformat = ">=1.0.8,<2"
pydantic = ">=2.7.3,<3"
gemmi = ">=0.6,<0.8"              # pyrs.pole_figures: CIF files and structure factors
openpyxl = ">=3.1,<4"             # pyrs.pole_figures: Excel scan table
neutrons_standard = "*"


# ------------------------------- #
# Pixi Feature Dependencies       #
# ------------------------------- #
[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-qt = "*"
pytest-cov = "*"
pytest-timeout = "*"
pytest-xdist = "*"
mypy = "*"
trimesh = ">=4"      # pyrs.pole_figures tests: cross-check the STL path lengths
rtree = ">=1"        # trimesh ray tests without embree need the R-tree

[tool.pixi.feature.package.dependencies]
anaconda-client = "*"
conda-build = "*"
twine = "*"
versioningit = "*"
hatch = "*"
toml = "*"

# fix for pip audit
# cryptography = ">=46.0.6" ## TODO: not indexed yet: CVE-2026-34073 ##
h11 = ">=0.16.0"
py-lief = ">=0.17.2"
requests = ">=2.33.0"

[tool.pixi.feature.package.pypi-dependencies]
toml-cli = "*"

[tool.pixi.feature.developer.dependencies]
pre-commit = "*"
mypy = "*"
python-build = "*"
pip-audit = "*"

# ------------------------------- #
# ODF feature (opt-in)            #
# ------------------------------- #
# MTEX for Python (pymtex) for the ODF step of pyrs.pole_figures. Only the "odf" environment has it: pymtex is
# not distributed with PyRS (see [project.optional-dependencies] odf).
[tool.pixi.feature.odf.dependencies]
finufft = ">=2.5.1" # pymtex's NUFFT library (conda-forge has it compiled)
numba = ">=0.61"    # pymtex's compiled kernels (much faster)

[tool.pixi.feature.odf.pypi-dependencies]
mtex = ">=1.0,<2" # MTEX for Python (mtex-toolbox/pymtex), GPL-2.0-only, not distributed with PyRS

[tool.pixi.feature.odf.tasks]
test-odf = { cmd = "python scripts/development/run_tests.py tests/unit/pyrs/pole_figures/test_odf.py tests/unit/pyrs/pole_figures/test_mtex_options.py tests/integration/test_pole_figures_odf_reference.py tests/integration/test_pole_figures_odf_settings.py tests/ui/test_pole_figures_odf_tab.py", env = { QT_QPA_PLATFORM = "offscreen" }, description = "Run the ODF (MTEX for Python) tests, offscreen, in the odf environment" }

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-mermaid = "*"
sphinxcontrib-programoutput = "*"
types-pyyaml = "*"
versioningit = "*"

# ------------------------------- #
# Development Environment Feature #
# ------------------------------- #
[tool.pixi.feature.dev.dependencies]
python = "*"
pip = "*"
mantidworkbench = { version = ">=7.0.0", channel = "mantid/label/nightly" }
mantid = { channel = "mantid/label/nightly" }
mantidqt = { channel = "mantid/label/nightly" }
uncertainties = "*"
libarchive = "*"
pandas = "*"
types-six = "*"
nexusformat = ">=1.0.8,<2"
pydantic = ">=2.7.3,<3"
gemmi = ">=0.6,<0.8"                                                        # pyrs.pole_figures: CIF files and structure factors
openpyxl = ">=3.1,<4"                                                       # pyrs.pole_figures: Excel scan table

# ------------------------------- #
# QA Environment Feature #
# ------------------------------- #
[tool.pixi.feature.qa.dependencies]
python = "*"
pip = "*"
# mantid-ornl/label/rc has no 7.x build yet (2026-11): take the upstream release until it does.
mantidworkbench = { version = ">=7.0.0, <7.1", channel = "mantid/label/main" }
mantid = { channel = "mantid/label/main" }
mantidqt = { channel = "mantid/label/main" }
uncertainties = "*"
libarchive = "*"
pandas = "*"
types-six = "*"
nexusformat = ">=1.0.8,<2"
pydantic = ">=2.7.3,<3"
gemmi = ">=0.6,<0.8"                                                           # pyrs.pole_figures: CIF files and structure factors
openpyxl = ">=3.1,<4"                                                          # pyrs.pole_figures: Excel scan table
py-rattler = "==0.24.0"

# ------------------------------- #
# Production Environment Feature #
# ------------------------------- #
[tool.pixi.feature.prod.dependencies]
python = "*"
pip = "*"
mantidworkbench = { version = ">=7.0.0, <7.1", channel = "mantid/label/main" }
mantid = { channel = "mantid/label/main" }
mantidqt = { channel = "mantid/label/main" }
uncertainties = "*"
libarchive = "*"
pandas = "*"
types-six = "*"
nexusformat = ">=1.0.8,<2"
pydantic = ">=2.7.3,<3"
gemmi = ">=0.6,<0.8"                                                           # pyrs.pole_figures: CIF files and structure factors
openpyxl = ">=3.1,<4"                                                          # pyrs.pole_figures: Excel scan table

[tool.pixi.package]
name = "pyrs"
version = "1.9.0.dev32" # placeholder, overwritten by sync-version

[tool.pixi.package.build.backend]
name = "pixi-build-python"
# Unconstrained: pixi-build-python's build.dependencies (pixi-build-api-version)
# track the protocol version of the pixi CLI itself, which advances independently.
# CI pins `pixi-version` in prefix-dev/setup-pixi, but developers' local pixi may differ.
# An exact pin (e.g. "==0.5.2", requiring pixi-build-api-version >=4,<5) breaks
# as soon as the installed pixi CLI needs a newer protocol (e.g. >=5,<6, required
# since pixi-build-python 0.6.0) -- no channel/version combination can satisfy
# both an old exact pin and a newer pixi CLI at the same time.
version = "*"
channels = [
  "conda-forge",
  "mantid-ornl/label/main",         # ORNL-specific stable releases
  "mantid-ornl/label/rc",           # Fallback to RC if stable not available
  "mantid-ornl/label/nightly",      # ORNL-specific nightly builds
  "mantid/label/main",              # Primary source for stable Mantid releases
  "mantid/label/nightly",           # Upstream nightly builds
  "https://prefix.dev/conda-forge",
]

[tool.pixi.environments]
default = { features = [
  "docs",
  "developer",
  "dev",
  "package",
  "test",
], solve-group = "default" }
# Production environment with stable Mantid versions
prod = { features = ["test", "package", "docs", "prod"], solve-group = "prod" }
# Development environment with nightly Mantid builds
dev = { features = ["test", "package", "docs", "dev"], solve-group = "dev" }
# QA environment with RC or prod packages
qa = { features = ["test", "package", "docs", "qa"], solve-group = "qa" }
# Opt-in: the default environment plus MTEX for Python (pymtex) for the ODF step. Same solve group as default,
# so the packages they share have the same versions.
odf = { features = [
  "docs",
  "developer",
  "dev",
  "package",
  "test",
  "odf",
], solve-group = "default" }

# Environment-specific channel configurations
[tool.pixi.feature.dev.activation.env]
# Development environment can use nightly builds
MANTID_CHANNEL_PRIORITY = "nightly"

[tool.pixi.feature.qa.activation.env]
# QA environment uses RC or prod packages
MANTID_CHANNEL_PRIORITY = "rc_prod"

[tool.pixi.feature.prod.activation.env]
# Production environment uses only stable releases
MANTID_CHANNEL_PRIORITY = "stable_only"


# --------------- #
# Pixi Tasks      #
# --------------- #
[tool.pixi.tasks]
# PyPi packaging tasks
build-pypi = { cmd = "hatch build", description = "Build the package for PyPI" }
publish-pypi = { cmd = "twine upload dist/*", description = "Publish the package to PyPI", depends-on = [
  "build-pypi",
] }
publish-pypi-test = { cmd = "twine upload --repository testpypi dist/*", description = "Publish the package to TestPyPI", depends-on = [
  "build-pypi",
] }
clean-pypi = { cmd = "rm -rf dist", description = "Clean the PyPI build artifacts" }

# Conda packaging tasks
build-conda-command = { cmd = "pixi publish --target-dir .", description = "Build the conda package" }
build-conda = { description = "Build the conda package", depends-on = [
  "backup-toml",
  "sync-version",
  "build-conda-command",
  "reset-toml",
] }
conda-build = { description = "Alias for build-conda (used by CI workflows)", depends-on = [
  "build-conda",
] }
publish-conda = { cmd = "anaconda upload *.conda", description = "Publish the .conda package to anaconda.org", depends-on = [
  "build-conda",
] }
conda-publish = { cmd = "anaconda upload *.conda", description = "Publish the .conda package to anaconda.org", depends-on = [
  "conda-build",
] }

# Cleaning
clean = { cmd = 'rm -rf .pytest_cache .ruff_cache **/*.egg-info **/dist **/__pycache__', description = "Clean up various caches and build artifacts" }
clean-conda = { cmd = "rm -f *.conda", description = "Clean the local .conda build artifacts" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean up documentation build artifacts" }
clean-all = { description = "Clean all artifacts", depends-on = [
  "clean",
  "clean-conda",
  "clean-docs",
  "clean-pypi",
] }


# Documentation tasks
build-docs = { cmd = "sphinx-build -b html docs/user/source docs/_build/user", description = "Build the User documentation" }
build-dev-docs = { cmd = "sphinx-build -b html docs/developer/source docs/_build/developer", description = "Build the Developer documentation" }
docs-serve = { cmd = "python -m http.server 8000 -d docs/_build/user", description = "Serve User documentation locally on port 8000" }
docs-autobuild = { cmd = "sphinx-autobuild docs/user/source docs/_build/user --host 0.0.0.0 --port 8000", description = "Auto-rebuild and serve User docs on changes" }

# Testing tasks
test = { cmd = "python scripts/development/run_tests.py --cov=pyrs --cov-report=xml --cov-report=term ./tests", description = "Run the tests with coverage" }
test-unit = { cmd = "python scripts/development/run_tests.py -m 'not integration and not gui and not ring_calibration' -n auto --maxprocesses=8 --dist loadscope ./tests", description = "Run fast tests only: no file I/O, no GUI, no full ring calibration (in parallel: one worker per core, at most 8)" }
test-ring-calibration = { cmd = "python scripts/development/run_tests.py -m 'ring_calibration and not integration and not gui' ./tests", description = "Run the ring-calibration tests on the synthetic run (serial: one process computes the shared calibration once, #1101)" }
test-integration = { cmd = "python scripts/development/run_tests.py -m 'integration and not gui' -n auto --maxprocesses=8 --dist loadscope ./tests", description = "Run tests that read/write real data (in parallel: one worker per core, at most 8)" }
test-gui = { cmd = "python scripts/development/run_tests.py -m gui ./tests", env = { QT_QPA_PLATFORM = "offscreen" }, description = "Run tests that drive Qt widgets (offscreen; no windows appear; serial: they share one window)" }
# CI (#1100): one job per tier, with coverage; the display comes from xvfb-run, so no QT_QPA_PLATFORM here
test-ci-unit = { cmd = "python scripts/development/run_tests.py -m 'not integration and not gui and not ring_calibration' -n auto --dist loadscope --cov=pyrs --cov-report=xml --cov-report=term ./tests", description = "CI: unit tier, parallel, with coverage" }
test-ci-ring-calibration = { cmd = "python scripts/development/run_tests.py -m 'ring_calibration and not integration and not gui' --cov=pyrs --cov-report=xml --cov-report=term ./tests", description = "CI: ring-calibration tier, serial, with coverage" }
test-ci-integration = { cmd = "python scripts/development/run_tests.py -m 'integration and not gui' -n auto --dist loadscope --cov=pyrs --cov-report=xml --cov-report=term ./tests", description = "CI: integration tier, parallel, with coverage" }
test-ci-gui = { cmd = "python scripts/development/run_tests.py -m gui --cov=pyrs --cov-report=xml --cov-report=term ./tests", description = "CI: GUI tier, serial, with coverage" }
test-import-framework = { cmd = "python -c 'import pyrs'; python -c 'import qtpy'; python -c 'import mantidqt'", description = "Test import of main dependencies" }

# Calibration
pyrs-pixel-calibration = { cmd = "python scripts/pyrs_pixel_calibration.py", description = "Ring-based detector calibration from a NeXus run (see --help)" }

# MISC
audit-deps = { cmd = "pip-audit --local -s osv --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-34073", description = "Audit the package dependencies for vulnerabilities" }

sync-version = { cmd = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml', description = "Sync pyproject.toml version with Git version" }
backup-toml = { cmd = "cp pyproject.toml pyproject.toml.bak", description = "Backup the pyproject.toml file" }
reset-toml = { cmd = "cp pyproject.toml.bak pyproject.toml; rm pyproject.toml.bak", description = "Reset the pyproject.toml file to the original state" }

# Application tasks
pyrs = { cmd = "pyrsplot", description = "Start the pyrs application" }

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true

# pyside6 6.11.3 build _1 ships py.typed: through qtpy, mypy then checks PyRS against PySide6's scoped enums
# and rejects the short forms qtpy provides at runtime (QMessageBox.Yes, ...). Treated as untyped, as before
# that build, until the code uses the scoped names (docs/ground_truths.md, "mypy and PySide6's type stubs").
[[tool.mypy.overrides]]
module = ["PySide6.*"]
follow_imports = "skip"
follow_imports_for_stubs = true # PySide6's types come from its .pyi stubs, which "skip" leaves alone otherwise

[tool.pytest.ini_options]
# By-hand smoke-test scripts, never collected -- see tests/scripts/cis_tests/README.rst
norecursedirs = ["tests/scripts"]
addopts = "--strict-markers"
# No test may hang. `thread` (not the `signal` default) is required: a test blocked
# inside Qt's C++ event loop never returns to the interpreter, so SIGALRM would never
# be delivered -- the watchdog thread dumps every thread's stack and exits instead.
# 300s is ~7x the slowest test observed (41.8s), so it leaves ample room on slow CI.
timeout = 300
timeout_method = "thread"
markers = [
  "integration: exercises real file I/O (tests/data, /HFIR archive) or a multi-component workflow",
  "gui: constructs or drives Qt widgets; requires a display (xvfb or offscreen)",
  "ring_calibration: runs or uses the full ring calibration of the synthetic run; its own tier, one process, so the shared calibration is computed once (#1101)",
]

[tool.ruff]
line-length = 119
target-version = "py311"
exclude = ["pyrs/icons", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# WARNING: there are multiple `conftest.py` files!
"**/conftest.py" = ["F401", "F811"]

[tool.ruff.format]
line-ending = "lf"
