# Audit manifest for the NXstress-prod plan series.
#
# Consumed ONLY via plans/audit-process/tools/manifest.py -- no tool parses this
# file itself, so validation cannot be skipped by a tool that forgot.
#
# Every key below is REQUIRED, and a wrong value fails at LOAD, not at use.
# Unknown keys are an error, not a no-op. See plans/audit-process/process.md
# section 7.2 for the full failure table and the reasoning.

[series]
name = "NXstress-prod"
readme = "README.md"
earlier_draft = "archive/overview.md" # "" means none; ABSENT is an error
subspecs = "[0-9]*.md"                # the 12 subspecs; excludes README.md
open_questions = "open-questions/"
probes = "probes/"
findings = "review/findings.md"

[series.ownership]
# The table naming which document owns which file.
heading = "## 5. Files to be Modified"
spec_column = 1
file_columns = [2, 3]
spec_pattern = '\(?(\d+[a-z]?)\)?'     # "2/3 (04b)" -> 04b ; "3 (05)" -> 05 ; "1" -> phase
brace_expand = true                    # "{_peaks,_fit}.py" is pervasive in that table

[series.dependencies]
marker = "**Depends on:**"
# Takes three shapes in this series, all of which the parser must handle:
#   inline link ......... 02, 03, 04, 04c, 10
#   bullet list below ... 04b, 05, 09
#   em dash + prose ..... 01, 06, 07, 08
wraps = true

[series.subspec_sections]
# Non-uniform across this series -- itself an A2 finding, to be surfaced and not
# papered over: "## NXstress / GUI Changes" in 02 and 03, "## NXstress Changes"
# in 04, 04b, 04c, 05, 07 and 09.
change_headings = [
  "## PyRS Changes",
  "## NXstress Changes",
  "## NXstress / GUI Changes",
]
verification = "## Verification"
followup_prefix = "## Follow-up" # scanned by check_citations.py; see section 7.7

[git]
main_branch = "next"
base_commit = "7a5ef73f"
base_subject = "Merge pull request #1000 from neutrons/qt_lock_fix"
# `base_subject` is the defense against the one manifest error that would
# otherwise fail SILENTLY: a hash from another branch will exist, and may even be
# an ancestor, but will not match the subject a human wrote down beside it.
#
# The plan documents were authored on an unsquashed parent branch before plans/
# was re-added at 5b9dfe98, so `git log <planfile>` does NOT date their claims.
# This is the commit their prose was actually written against.
claims_written_against = "492350bd"

[scope]
# The depth of THIS pass. Every file matched by series.subspecs must appear in
# exactly one list below, or the loader errors -- a document nobody classified is
# the silent gap this whole system exists to prevent.
full = [
  "README.md",
  "04-*.md",
  "04b-*.md",
  "04c-*.md",
  "05-*.md",
  "06-*.md",
  "07-*.md",
  "08-*.md",
  "09-*.md",
  "10-*.md",
]
freshness_only = [
  "01-*.md",
  "02-*.md",
  "03-*.md",
] # landed; claims settled by shipped code

[exclude]
# Tools DISCOVER documents by walking the series directory; they do not scan only
# what is declared above. Every *.md found must match exactly one classification
# -- a [series] key, a [scope] entry, or a pattern here -- or the loader errors.
# A pattern matching zero files is also an error: a stale exclude is as bad as a
# missing one.
paths = ["archive/*.md"]
# prompts/ holds no *.md (only append.prompt.txt), so it needs no pattern -- and
# adding one would itself be a load error under the zero-match rule above.
# Excluding is not hiding. archive/ holds superseded drafts: never link-checked,
# citation-checked or landing-triggered, because a superseded draft is stale BY
# DEFINITION and reporting its staleness would bury the live findings. But
# check_drift.py still reads archive/overview.md through series.earlier_draft,
# which is the entire reason it was kept rather than deleted.

[code]
# Roots a cited repo path may resolve into. A citation resolving outside these is
# REPORTED as OUT-OF-SCOPE, never silently skipped.
roots = ["pyrs/", "scripts/", "tests/", "docs/", "pyproject.toml", "pixi.lock"]
